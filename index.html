<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安商房车库月租PC管理后台</title>
  <style>
    :root {
      --as-primary: #409eff;
      --as-primary-hover: #66b1ff;
      --as-primary-active: #3a8ee6;
      --as-primary-soft: rgba(64, 158, 255, 0.10);
      --as-primary-light: #ecf5ff;
      --as-bg-page: #f7f8fa;
      --as-bg-sidebar: #ffffff;
      --as-bg-card: #ffffff;
      --as-bg-table-head: #eef2f6;
      --as-bg-table-stripe: #fafbfe;
      --as-text-main: #333333;
      --as-text-sub: #666666;
      --as-text-muted: #999999;
      --as-text-inverse: #ffffff;
      --as-border: #e8ebf2;
      --as-border-light: #f0f2f5;
      --as-success: #14c075;
      --as-warning: #f88a33;
      --as-danger: #f66867;
      --as-info: #409eff;
      --as-chart-cyan: #00cc99;
      --as-shadow: 0 4px 14px rgba(36, 56, 128, 0.04);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--as-bg-page);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      color: var(--as-text-main);
      background: #f7f8fa;
      overflow: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .login-screen {
      min-height: 100vh;
      background: #f7f8fa;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 520px);
    }

    .login-brand {
      padding: 64px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-brand h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .login-brand p {
      margin: 0;
      color: var(--as-text-sub);
      line-height: 1.8;
      max-width: 560px;
    }

    .login-preview {
      margin-top: 36px;
      background: #fff;
      border: 1px solid var(--as-border-light);
      box-shadow: var(--as-shadow);
      border-radius: 4px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
    }

    .mini-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .mini-card { flex: 1; height: 72px; border-radius: 4px; background: #f8faff; border: 1px solid var(--as-border-light); padding: 12px; }
    .mini-title { color: var(--as-text-muted); font-size: 12px; }
    .mini-num { margin-top: 8px; color: var(--as-text-main); font-size: 22px; font-weight: 700; }
    .mini-line { height: 12px; border-radius: 2px; background: #ecf5ff; margin: 12px 0; }
    .mini-line:nth-child(2n) { width: 82%; }
    .mini-line:nth-child(2n+1) { width: 62%; }

    .login-panel-wrap { display: flex; align-items: center; justify-content: center; padding: 32px; }
    .login-panel {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid var(--as-border-light);
      border-radius: 4px;
      box-shadow: 0 12px 36px rgba(36, 56, 128, 0.08);
      padding: 36px;
    }

    .login-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .login-sub { color: var(--as-text-muted); margin-bottom: 28px; }
    .form-item { margin-bottom: 18px; }
    .form-label { margin-bottom: 8px; color: var(--as-text-sub); }
    .form-control {
      width: 100%;
      height: 38px;
      border: 1px solid var(--as-border);
      border-radius: 4px;
      padding: 0 12px;
      color: var(--as-text-main);
      background: #fff;
      outline: none;
    }
    .form-control:focus { border-color: var(--as-primary); box-shadow: 0 0 0 3px var(--as-primary-soft); }

    .app { height: 100vh; display: grid; grid-template-columns: 240px 1fr; overflow: hidden; background: #f7f8fa; }
    .hidden { display: none !important; }

    .sidebar {
      background: var(--as-bg-sidebar);
      border-right: 1px solid var(--as-border);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .sidebar-logo {
      height: 68px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px;
      font-size: 18px;
      font-weight: 700;
      color: var(--as-text-main);
      border-bottom: 1px solid var(--as-border-light);
      white-space: nowrap;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--as-primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(64, 158, 255, 0.22);
    }

    .menu { padding: 12px 0 18px; overflow: auto; }
    .menu-item {
      height: 48px;
      margin: 0 12px 3px;
      padding: 0 15px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 400;
      color: var(--as-text-main);
      border: 0;
      background: transparent;
      width: calc(100% - 24px);
      text-align: left;
    }
    .menu-item:hover { background: #f4f7ff; color: var(--as-primary); }
    .menu-item.active { background: var(--as-primary-light); color: var(--as-primary); font-weight: 400; box-shadow: none; }
    .menu-icon { width: 18px; height: 18px; display: grid; place-items: center; color: currentColor; opacity: .9; }
    .menu-icon svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .menu-parent { justify-content: space-between; }
    .menu-parent-main { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
    .menu-parent-arrow { width: 16px; height: 16px; display: grid; place-items: center; color: var(--as-text-muted); transition: transform .16s ease; }
    .menu-parent-arrow svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .menu-parent.expanded .menu-parent-arrow { transform: rotate(180deg); }
    .menu-submenu { padding: 0 0 4px; }
    .menu-subitem { height: 42px; margin: 0 12px 2px; padding: 0 15px 0 43px; border: 0; border-radius: 4px; background: transparent; color: var(--as-text-main); font-size: 14px; font-weight: 400; text-align: left; width: calc(100% - 24px); display: flex; align-items: center; gap: 10px; }
    .menu-subitem:hover { background: #f4f7ff; color: var(--as-primary); }
    .menu-subitem.active { background: var(--as-primary-light); color: var(--as-primary); }
    .menu-subitem-icon { width: 16px; height: 16px; display: grid; place-items: center; color: currentColor; opacity: .88; }
    .menu-subitem-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .main { min-width: 0; min-height: 0; display: grid; grid-template-rows: 64px 1fr; }
    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid var(--as-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .breadcrumb { color: var(--as-text-sub); }
    .topbar-actions { display: flex; align-items: center; gap: 22px; color: var(--as-text-sub); }
    .account { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--as-primary); background: var(--as-primary-soft); font-weight: 700; }

    .page { min-height: 0; overflow: auto; padding: 24px 28px 34px; }
    .page-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; margin-bottom: 18px; }
    .page-title { font-size: 24px; line-height: 1.25; font-weight: 700; margin: 0; }
    .page-actions { display: flex; align-items: center; gap: 10px; }

    .btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 4px;
      border: 1px solid var(--as-border);
      background: #fff;
      color: var(--as-text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--as-primary); color: var(--as-primary); }
    .btn-primary { background: var(--as-primary); border-color: var(--as-primary); color: #fff; }
    .btn-primary:hover { background: var(--as-primary-hover); border-color: var(--as-primary-hover); color: #fff; }
    .btn-danger { background: var(--as-danger); border-color: var(--as-danger); color: #fff; }
    .btn-text { height: auto; padding: 0; border: 0; background: transparent; color: var(--as-primary); }
    .btn-text.danger { color: var(--as-danger); }

    .panel {
      background: #fff;
      border-radius: 4px;
      border: 1px solid var(--as-border-light);
      box-shadow: var(--as-shadow);
      margin-bottom: 18px;
      overflow: hidden;
    }
    .list-panel {
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: visible;
    }
    .list-panel > .filter-bar {
      margin-bottom: 14px;
      padding: 0;
      border-bottom: 0;
      background: transparent;
      gap: 8px 10px;
    }
    .list-panel > .tabs {
      padding: 0 0 14px;
      background: transparent;
    }
    .list-panel > table,
    .list-panel > .pager {
      background: #fff;
    }
    .list-panel > table {
      border-radius: 4px 4px 0 0;
      overflow: hidden;
    }
    .list-panel > .pager {
      border-radius: 0 0 4px 4px;
    }
    .panel-header {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--as-border-light);
    }
    .panel-title { position: relative; padding-left: 14px; font-size: 16px; font-weight: 700; }
    .panel-title::before { content: ""; position: absolute; left: 0; top: 50%; width: 5px; height: 16px; transform: translateY(-50%); background: var(--as-primary); border-radius: 1px; }
    .data-panel-title { font-size: 16px; font-weight: 700; }
    .panel-body { padding: 20px 22px; }

    .dashboard-page { min-width: 0; color: var(--as-text-main); }
    .dashboard-page-head { display: flex; align-items: center; justify-content: space-between; min-height: 62px; margin-bottom: 22px; padding: 0 28px; background: #f4f8ff; border: 1px solid #e0e9f8; border-radius: 8px; }
    .dashboard-page-title { margin: 0; font-size: 23px; line-height: 1.3; font-weight: 700; color: #22324a; }
    .dashboard-page-title strong { font-weight: 700; }
    .dashboard-page-date { color: #7c8ca4; font-size: 13px; }
    .dashboard-section { margin-bottom: 22px; background: #fff; border: 1px solid #e1e8f4; border-radius: 8px; box-shadow: 0 8px 24px rgba(38, 73, 130, .05); overflow: hidden; }
    .dashboard-overview-panel { background: transparent; border: 0; box-shadow: none; overflow: visible; }
    .dashboard-metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .dashboard-metric { position: relative; min-height: 154px; padding: 25px 28px 19px 32px; border: 1px solid #e3eaf5; border-radius: 8px; background: #fff; box-shadow: 0 8px 20px rgba(39, 79, 143, .06); overflow: hidden; }
    .dashboard-metric::before { content: ''; position: absolute; left: 0; top: 31px; width: 4px; height: 36px; border-radius: 0 4px 4px 0; background: var(--dashboard-accent); }
    .dashboard-metric-label { color: #718198; font-size: 15px; line-height: 1.5; font-weight: 600; }
    .dashboard-metric-value { margin-top: 14px; color: #1e2e46; font-family: inherit; font-size: 38px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .dashboard-metric-unit { margin-left: 5px; color: #6d7e96; font-family: inherit; font-size: 15px; font-weight: 400; font-variant-numeric: normal; }
    .dashboard-metric-change { display: flex; align-items: center; gap: 6px; margin-top: 17px; color: #287ed4; font-size: 13px; font-weight: 700; }
    .dashboard-metric-change-arrow { font-size: 18px; line-height: 1; }
    .dashboard-metric-icon { position: absolute; top: 24px; right: 26px; width: 58px; height: 58px; display: grid; place-items: center; border: 1px solid var(--dashboard-icon-border); border-radius: 12px; background: var(--dashboard-icon-bg); color: var(--dashboard-accent); }
    .dashboard-metric-icon svg { width: 28px; height: 28px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dashboard-metric:nth-child(1) { --dashboard-accent: #3475d7; --dashboard-icon-bg: #eef5ff; --dashboard-icon-border: #bfd5fb; }
    .dashboard-metric:nth-child(2) { --dashboard-accent: #2c91c9; --dashboard-icon-bg: #eefaff; --dashboard-icon-border: #b9e2f3; }
    .dashboard-metric:nth-child(3) { --dashboard-accent: #3d83ca; --dashboard-icon-bg: #f0f7ff; --dashboard-icon-border: #c6ddf6; }
    .dashboard-metric:nth-child(4) { --dashboard-accent: #536fae; --dashboard-icon-bg: #f1f5ff; --dashboard-icon-border: #cdd8f2; }
    .dashboard-trend-panel { min-height: 460px; }
    .dashboard-trend-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 25px 28px 0; }
    .dashboard-trend-title { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700; color: #22324a; }
    .dashboard-trend-date { color: #7c8ca4; font-size: 13px; }
    .dashboard-trend-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 28px 0; }
    .dashboard-chart-range { display: inline-flex; border: 1px solid #cbd8eb; border-radius: 6px; overflow: hidden; }
    .dashboard-range-button { height: 32px; min-width: 54px; padding: 0 12px; border: 0; border-right: 1px solid #cbd8eb; background: #fff; color: #687992; font-size: 13px; }
    .dashboard-range-button:last-child { border-right: 0; }
    .dashboard-range-button:hover { color: var(--as-primary); background: #f5f9ff; }
    .dashboard-range-button.active { color: #fff; background: var(--as-primary); }
    .dashboard-chart-grid-layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding: 18px 28px 28px; }
    .dashboard-mini-chart { min-width: 0; border: 1px solid #e1e8f4; border-radius: 8px; background: #fff; overflow: hidden; }
    .dashboard-mini-chart-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 20px 0; }
    .dashboard-mini-chart-title { margin: 0; color: #34445d; font-size: 15px; font-weight: 700; }
    .dashboard-mini-chart-current { color: #2f71ce; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .dashboard-mini-chart-unit { margin: 12px 20px 0; color: #8a98ab; font-size: 12px; }
    .dashboard-chart-wrap { height: 220px; padding: 8px 20px 20px; }
    .dashboard-chart { width: 100%; height: 100%; display: block; overflow: visible; }
    .dashboard-chart-grid { stroke: #dce5f1; stroke-width: 1; }
    .dashboard-chart-axis { fill: #8a98ab; font-size: 13px; }
    .dashboard-chart-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .dashboard-chart-area { fill: #edf4ff; opacity: .8; }
    .dashboard-chart-point { fill: #fff; stroke-width: 2.5; }
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; min-width: 960px; margin-bottom: 18px; }
    .todo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .todo-item { min-height: 70px; border: 1px solid var(--as-border-light); border-radius: 4px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; }
    .todo-item:hover { border-color: #dce4ff; background: #fbfcff; }
    .todo-name { font-weight: 700; }
    .todo-desc { margin-top: 6px; color: var(--as-text-muted); font-size: 12px; }
    .todo-count { min-width: 42px; height: 30px; border-radius: 15px; display: grid; place-items: center; background: var(--as-primary-soft); color: var(--as-primary); font-weight: 700; }
    .quick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .quick-link { min-height: 72px; border: 1px solid var(--as-border-light); border-radius: 4px; background: #fff; padding: 14px; display: flex; align-items: center; gap: 12px; color: var(--as-text-main); }
    .quick-link:hover { border-color: #dce4ff; background: #fbfcff; color: var(--as-primary); }
    .quick-link > span:last-child { min-width: 0; text-align: left; }
    .quick-icon { width: 34px; height: 34px; border-radius: 4px; display: grid; place-items: center; background: var(--as-primary-light); color: var(--as-primary); }
    .quick-icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .quick-name { font-weight: 700; }
    .quick-desc { margin-top: 4px; color: var(--as-text-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .workbench-table { min-width: 960px; }

    .garage-row { padding: 14px 0; border-bottom: 1px solid var(--as-border-light); }
    .garage-row:last-child { border-bottom: 0; }
    .garage-main { display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
    .garage-meta { margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); color: var(--as-text-sub); font-size: 12px; }
    .progress { height: 6px; background: #edf1f7; border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--as-primary); }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--as-border-light); background: #fff; }
    .input, .select {
      height: 36px;
      min-width: 160px;
      border: 1px solid var(--as-border);
      border-radius: 4px;
      background: #fff;
      color: var(--as-text-main);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
    }
    input.input { outline: none; }
    input.input:focus, .select-trigger:focus { border-color: var(--as-primary); box-shadow: 0 0 0 3px var(--as-primary-soft); }
    .filter-dropdown { position: relative; min-width: 164px; }
    .select-trigger {
      height: 36px;
      width: 100%;
      border: 1px solid var(--as-border);
      border-radius: 4px;
      background: #fff;
      color: var(--as-text-main);
      padding: 0 10px 0 12px;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }
    .select-trigger:hover, .filter-dropdown.open .select-trigger { border-color: var(--as-primary); }
    .select-trigger svg { width: 16px; height: 16px; stroke: var(--as-text-muted); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform .16s ease; }
    .filter-dropdown.open .select-trigger svg { transform: rotate(180deg); stroke: var(--as-primary); }
    .select-menu {
      position: absolute;
      z-index: 12;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      display: none;
      padding: 4px 0;
      background: #fff;
      border: 1px solid #dbe3f4;
      border-radius: 4px;
      box-shadow: 0 8px 18px rgba(36, 56, 128, .14);
    }
    .filter-dropdown.open .select-menu { display: block; }
    .select-option {
      width: 100%;
      min-height: 32px;
      padding: 0 12px;
      border: 0;
      background: #fff;
      color: var(--as-text-main);
      text-align: left;
      white-space: nowrap;
    }
    .select-option:hover { background: #f4f7ff; color: var(--as-primary); }
    .select-option.active { background: var(--as-primary-light); color: var(--as-primary); font-weight: 700; }
    .garage-filter-bar { min-height: 36px; margin-bottom: 14px; padding: 0; gap: 8px 10px; background: transparent; border-bottom: 0; }
    .garage-filter-bar .input { width: 220px; }
    .garage-filter-bar .btn { padding-left: 13px; padding-right: 13px; }
    .user-filter-bar .select { min-width: 164px; }
    .order-filter-bar .filter-dropdown { min-width: 164px; }
    .garage-table-panel { background: #fff; }
    .order-table-panel { overflow-x: auto; }
    .order-table-panel table { min-width: 1180px; }
    .order-table-panel .table-actions { flex-wrap: wrap; gap: 8px 12px; }
    .order-checkbox { display: block; width: 15px; height: 15px; margin: 0 auto; accent-color: var(--as-primary); }
    .table-checkbox-cell { width: 44px; padding: 0 14px; font-size: 0; line-height: 0; text-align: center; }
    .order-table-panel .table-actions { min-width: 220px; }
    .input.muted { color: var(--as-text-muted); }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
    th { height: 54px; padding: 0 18px; background: var(--as-bg-table-head); color: var(--as-text-main); text-align: left; font-weight: 700; border-bottom: 1px solid var(--as-border-light); }
    td { height: 56px; padding: 0 18px; color: var(--as-text-main); border-bottom: 1px solid var(--as-border-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .table-cell-ellipsis { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr:nth-child(even) td { background: var(--as-bg-table-stripe); }
    tr:hover td { background: #f3f6ff; }
    .table-actions { display: flex; gap: 12px; align-items: center; }
    .user-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .user-cell-avatar { flex: 0 0 auto; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--as-primary-soft); color: var(--as-primary); font-size: 13px; font-weight: 700; }

    function saveInvoiceUpload() {
      const record = invoiceById(invoiceUploadDraft?.id);
      if (!record || !invoiceUploadDraft) return;
      let valid = true;
      invoiceUploadDraft.items.forEach((ticket, index) => {
        if (!ticket.feeItem) { setInvoiceUploadError(index, 'feeItem', '请选择收费项目'); valid = false; }
        const amount = Number(ticket.amount);
        if (!Number.isFinite(amount) || amount <= 0) { setInvoiceUploadError(index, 'amount', '请输入大于0的票据金额'); valid = false; }
        if (!ticket.number.trim()) { setInvoiceUploadError(index, 'number', '请输入票据号码'); valid = false; }
        if (!ticket.date) { setInvoiceUploadError(index, 'date', '请选择开具日期'); valid = false; }

      });
      if (!valid) return;

      const uploadedTotal = invoiceUploadDraft.items.reduce((sum, ticket) => sum + (Number(ticket.amount) || 0), 0);
      if (Math.abs(uploadedTotal - requestedTotal) > 0.01) {
        showModal('票据金额不一致', `票据金额合计为 ¥${uploadedTotal.toFixed(2)}，与申请金额 ¥${requestedTotal.toFixed(2)} 不一致，请核对后再上传。`);
        return;
      }
      record.uploadedTickets = invoiceUploadDraft.items.map(ticket => ({ ...ticket, uploadedAt: '2026-08-29 14:20' }));
      record.status = '已完成';
      record.completedAt = '2026-08-29 14:20';
      hideModal();
      invoiceUploadDraft = null;

          required(item.receiverKey, '收款主体名称', newGarageForm[item.receiverKey]);

      refund[11] = `¥${amount.toFixed(2)}`;
      refund[12] = completedAt;
      refund[13] = processedBy;
      refund[14] = flowNo;
      selectedRefundIds.delete(refund[0]);
      const order = orders.find(item => item[0] === refund[1]);
      if (order) {
        order[5] = '已退款';
        order[7] = '已结束';
      }
      rentUsers.forEach(user => user.records.filter(record => record.orderNo === refund[1]).forEach(record => {
        record.rentStatus = '已退款';
        record.trafficStatus = '已结束';
        record.syncAt = completedAt;
      }));
      refundAuditRecords[refund[0]] = { result: '通过', note: `退款已登记完成，线下退款流水号：${flowNo}` };
    }
    function openBatchRefundCompletion() {
      const selected = selectedRefundRecords();
      if (!selected.length) {
        showModal('请选择退款申请', '请先勾选需要登记退款的申请。');
        return;
      }
      const pending = selected.filter(refund => refund[7] === '待退款');
      if (pending.length !== selected.length) {
        showModal('无法批量登记退款', '批量登记只支持状态为“待退款”的退款申请，请取消勾选待审批、已退款或已驳回的记录。');
        return;
      }
      const now = new Date();
      const localValue = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}T${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const items = pending.map(refund => `<section class="refund-batch-item"><div class="refund-batch-item-head"><span>${refund[0]} · ${refund[3]}</span><span class="refund-batch-item-meta">原订单 ${refund[1]} · 预计退款 ${refund[6]}</span></div><div class="modal-form-grid"><div class="modal-form-field"><label for="batchRefundAmount_${refund[0]}">实际退款金额</label><input id="batchRefundAmount_${refund[0]}" class="form-control" type="number" min="0.01" step="0.01" value="${String(refund[6]).replace(/[¥,]/g, '')}"><div id="batchRefundAmountError_${refund[0]}" class="modal-field-error"></div></div><div class="modal-form-field"><label for="batchRefundAt_${refund[0]}">退款时间</label><input id="batchRefundAt_${refund[0]}" class="form-control" type="datetime-local" value="${localValue}"><div id="batchRefundAtError_${refund[0]}" class="modal-field-error"></div></div><div class="modal-form-field"><label for="batchRefundFlow_${refund[0]}">退款流水号</label><input id="batchRefundFlow_${refund[0]}" class="form-control" placeholder="请输入线下退款流水或凭证号"><div id="batchRefundFlowError_${refund[0]}" class="modal-field-error"></div></div><div class="modal-form-field"><label>处理人</label><input class="form-control" value="${currentLoginName === 'admin' ? '超级管理员' : currentLoginName}" readonly></div></div></section>`).join('');
      showModal('批量登记已退款', `<div class="create-help" style="margin:-4px 0 18px">共 ${pending.length} 笔退款。每笔退款必须分别填写实际金额和线下退款流水号，提交后统一更新为“已退款”。</div><div class="refund-batch-list">${items}</div>`);
      const modal = document.querySelector('#modalMask .modal');
      if (modal) modal.classList.add('refund-approval-modal');
      const confirmButton = document.getElementById('modalConfirmButton');
      if (confirmButton) {
        confirmButton.textContent = '确认批量登记';
        confirmButton.onclick = () => completeRefundBatch(pending.map(refund => refund[0]));
      }
    }
    function completeRefundBatch(ids) {
      const selected = ids.map(id => refunds.find(refund => refund[0] === id)).filter(Boolean);
      const processedBy = currentLoginName === 'admin' ? '超级管理员' : currentLoginName;
      const values = [];
      let valid = true;
      selected.forEach(refund => {
        const amountField = document.getElementById(`batchRefundAmount_${refund[0]}`);
        const amountError = document.getElementById(`batchRefundAmountError_${refund[0]}`);
        const atField = document.getElementById(`batchRefundAt_${refund[0]}`);
        const atError = document.getElementById(`batchRefundAtError_${refund[0]}`);
        const flowField = document.getElementById(`batchRefundFlow_${refund[0]}`);
        const flowError = document.getElementById(`batchRefundFlowError_${refund[0]}`);
        const amount = Number(amountField?.value);
        const flowNo = flowField?.value.trim() || '';
        const originalPaid = refundOriginalPaid(refund);
        const expectedRefund = Number(String(refund[6]).replace(/[¥,]/g, ''));
        if (!Number.isFinite(amount) || amount <= 0) { if (amountError) amountError.textContent = '请输入大于0的实际退款金额'; valid = false; }
        else if (amount > originalPaid) { if (amountError) amountError.textContent = `不能超过原支付金额 ¥${originalPaid.toFixed(2)}`; valid = false; }
        else if (Number.isFinite(expectedRefund) && amount > expectedRefund) { if (amountError) amountError.textContent = `不能超过预计退款金额 ¥${expectedRefund.toFixed(2)}`; valid = false; }
        if (!atField?.value) { if (atError) atError.textContent = '请选择退款时间'; valid = false; }
        if (!flowNo) { if (flowError) flowError.textContent = '请输入退款流水号或线下凭证号'; valid = false; }
        values.push({ refund, amount, completedAt: atField?.value ? atField.value.replace('T', ' ') : '', flowNo, flowError });
      });
      const flowNos = new Set();
      values.forEach(value => {
        if (!value.flowNo) return;
        if (flowNos.has(value.flowNo) || refunds.some(item => item !== value.refund && item[14] === value.flowNo)) {
          if (value.flowError) value.flowError.textContent = '该退款流水号已登记或在本批次中重复';
          valid = false;
        }
        flowNos.add(value.flowNo);
      });
      if (!valid) return;
      values.forEach(value => applyRefundCompletion(value.refund, value.amount, value.completedAt, processedBy, value.flowNo));
      selectedRefundIds.clear();
      hideModal();
      render();
      showModal('批量登记完成', `已完成 ${values.length} 笔线下退款登记，相关订单和通行状态已同步更新为结束。`);
    }
    function refundActions(refund) {
      const status = refund[7];
      const actions = [`<button class="btn-text" onclick="openRefund('${refund[0]}')">详情</button>`];
      if (status === '待审批') actions.push(`<button class="btn-text" onclick="openRefundApproval('${refund[0]}')">审核</button>`);
      if (status === '待退款') actions.push(`<button class="btn-text" onclick="openRefundCompletion('${refund[0]}')">登记退款</button>`);
      return actions.join('');
    }
    function openRefundCompletion(id) {
      const refund = refunds.find(item => item[0] === id);
      if (!refund || refund[7] !== '待退款') return;
      const now = new Date();
      const localValue = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}T${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      showModal('登记已退款', `<div class="approval-summary"><div class="approval-summary-title">登记线下退款结果</div><div class="approval-summary-grid"><div class="approval-summary-item"><span class="approval-summary-label">退款单号</span><span class="approval-summary-value">${refund[0]}</span></div><div class="approval-summary-item"><span class="approval-summary-label">原订单号</span><span class="approval-summary-value">${refund[1]}</span></div><div class="approval-summary-item"><span class="approval-summary-label">预计退款</span><span class="approval-summary-value">${refund[6]}</span></div><div class="approval-summary-item"><span class="approval-summary-label">当前处理人</span><span class="approval-summary-value">${currentLoginName === 'admin' ? '超级管理员' : currentLoginName}</span></div></div></div><div class="modal-form-grid"><div class="modal-form-field"><label for="refundActualAmount">实际退款金额</label><input id="refundActualAmount" class="form-control" type="number" min="0.01" step="0.01" value="${String(refund[6]).replace(/[¥,]/g, '')}" placeholder="请输入实际退款金额"><div id="refundActualAmountError" class="modal-field-error"></div></div><div class="modal-form-field"><label for="refundCompletedAt">退款时间</label><input id="refundCompletedAt" class="form-control" type="datetime-local" value="${localValue}"><div id="refundCompletedAtError" class="modal-field-error"></div></div><div class="modal-form-field"><label for="refundProcessedBy">处理人</label><input id="refundProcessedBy" class="form-control" value="${currentLoginName === 'admin' ? '超级管理员' : currentLoginName}" readonly></div><div class="modal-form-field"><label for="refundFlowNo">退款流水号</label><input id="refundFlowNo" class="form-control" placeholder="请输入线下退款流水或凭证号"><div id="refundFlowNoError" class="modal-field-error"></div></div></div><div class="create-help">只有实际退款已完成并能提供线下退款流水或凭证号时，才可将状态更新为“已退款”。</div>`);
      const modal = document.querySelector('#modalMask .modal');
      if (modal) modal.classList.add('refund-approval-modal');
      const confirmButton = document.getElementById('modalConfirmButton');
      if (confirmButton) {
        confirmButton.textContent = '确认已退款';
        confirmButton.onclick = () => completeRefund(id);
      }
    }
    function completeRefund(id) {
      const refund = refunds.find(item => item[0] === id);
      const amountField = document.getElementById('refundActualAmount');
      const error = document.getElementById('refundActualAmountError');
      const completedAtField = document.getElementById('refundCompletedAt');
      const completedAtError = document.getElementById('refundCompletedAtError');
      const processedByField = document.getElementById('refundProcessedBy');
      const flowNoField = document.getElementById('refundFlowNo');
      const flowNoError = document.getElementById('refundFlowNoError');
      const amount = Number(amountField?.value);
      if (!refund || refund[7] !== '待退款') return;
      if (!Number.isFinite(amount) || amount <= 0) {
        if (error) error.textContent = '请输入大于0的实际退款金额';
        return;
      }
      const originalPaid = refundOriginalPaid(refund);
      if (amount > originalPaid) {
        if (error) error.textContent = `实际退款金额不能超过原支付金额 ¥${originalPaid.toFixed(2)}`;
        return;
      }
      const expectedRefund = Number(String(refund[6]).replace(/[¥,]/g, ''));
      if (Number.isFinite(expectedRefund) && expectedRefund > 0 && amount > expectedRefund) {
        if (error) error.textContent = `实际退款金额不能超过预计退款金额 ¥${expectedRefund.toFixed(2)}`;
        return;
      }
      if (!completedAtField?.value) {
        if (completedAtError) completedAtError.textContent = '请选择退款时间';
        return;
      }
      if (!flowNoField?.value.trim()) {
        if (flowNoError) flowNoError.textContent = '请输入退款流水号或线下凭证号';
        return;
      }
      const refundFlowNo = flowNoField.value.trim();
      if (refunds.some(item => item !== refund && item[14] === refundFlowNo)) {
        if (flowNoError) flowNoError.textContent = '该退款流水号已登记，请核对后重新填写';
        return;
      }
      const completedAt = completedAtField.value.replace('T', ' ');
      const processedBy = processedByField?.value || (currentLoginName === 'admin' ? '超级管理员' : currentLoginName);
      applyRefundCompletion(refund, amount, completedAt, processedBy, refundFlowNo);
      hideModal();
      render();
      showModal('已退款登记完成', `退款单 ${id} 已记录实际退款金额 ¥${amount.toFixed(2)}、退款流水号 ${refund[14]}，原订单月租和通行权限已结束。`);
    }
    function openRefundApproval(id) {
      const refund = refunds.find(item => item[0] === id);
      if (!refund || refund[7] !== '待审批') return;
      const [refundNo, orderNo, project, owner, plate, , amount, , , reason, submittedAt] = refund;
      showModal('退款审核', `<div class="approval-summary"><div class="approval-summary-title">请确认这笔退款申请</div><div class="approval-summary-grid"><div class="approval-summary-item"><span class="approval-summary-label">退款单号</span><span class="approval-summary-value">${refundNo}</span></div><div class="approval-summary-item"><span class="approval-summary-label">原订单号</span><span class="approval-summary-value">${orderNo}</span></div><div class="approval-summary-item"><span class="approval-summary-label">申请用户</span><span class="approval-summary-value">${owner}</span></div><div class="approval-summary-item"><span class="approval-summary-label">小区项目</span><span class="approval-summary-value">${project}</span></div><div class="approval-summary-item"><span class="approval-summary-label">退款车辆</span><span class="approval-summary-value">${plate}</span></div><div class="approval-summary-item"><span class="approval-summary-label">预计退款</span><span class="approval-summary-value">${money(amount)}</span></div><div class="approval-summary-item"><span class="approval-summary-label">申请时间</span><span class="approval-summary-value">${submittedAt}</span></div><div class="approval-summary-item"><span class="approval-summary-label">退款原因</span><span class="approval-summary-value">${reason}</span></div></div></div><label class="approval-reject-label" for="refundRejectReason">驳回原因</label><textarea id="refundRejectReason" class="form-control approval-reject-control" placeholder="如选择驳回，请填写具体原因"></textarea><div id="refundRejectError" class="approval-error"></div>`);
      document.querySelector('#modalMask .modal')?.classList.add('refund-approval-modal');
      const cancelButton = document.getElementById('modalCancelButton');
      const confirmButton = document.getElementById('modalConfirmButton');
      cancelButton.textContent = '驳回';
      cancelButton.className = 'btn btn-danger';
      cancelButton.onclick = () => rejectRefund(id);
      confirmButton.textContent = '通过';
      confirmButton.className = 'btn btn-primary';
      confirmButton.onclick = () => approveRefund(id);
    }
    function approveRefund(id) {
      const refund = refunds.find(item => item[0] === id);
      if (!refund || refund[7] !== '待审批') return;
      refund[7] = '待退款';
      refund[8] = '月租已终止';
      const order = orders.find(item => item[0] === refund[1]);
      if (order) {
        order[5] = '待退款';
        order[7] = '已终止';
      }
      selectedRefundIds.delete(id);
      rentUsers.forEach(user => user.records.filter(record => record.orderNo === refund[1]).forEach(record => {
        record.rentStatus = '退款处理中';
        record.trafficStatus = '月租已终止';
      }));
      refundAuditRecords[id] = { result: '通过', note: '退款审核通过，等待财务完成线下退款。' };
      hideModal();
      render();
      showModal('审核已通过', '退款申请已进入“待退款”，工作人员完成线下退款后，点击“登记退款”更新为“已退款”。');
    }
    function rejectRefund(id) {
      const reasonField = document.getElementById('refundRejectReason');
      const error = document.getElementById('refundRejectError');
      const reason = reasonField?.value.trim() || '';
      if (!reason) {
        if (error) error.textContent = '请输入驳回原因';
        if (reasonField) reasonField.classList.add('has-error');
        return;
      }
      const refund = refunds.find(item => item[0] === id);
      if (!refund || refund[7] !== '待审批') return;
      refund[7] = '已驳回';
      refund[8] = '通行已恢复';
      const order = orders.find(item => item[0] === refund[1]);
      if (order) {
        order[5] = '月租有效';
        order[7] = '已开通';
      }
      selectedRefundIds.delete(id);
      rentUsers.forEach(user => user.records.filter(record => record.orderNo === refund[1]).forEach(record => { record.trafficStatus = '已恢复'; }));
      refundAuditRecords[id] = { result: '驳回', note: reason };
      hideModal();
      render();
      showModal('退款申请已驳回', '已记录驳回原因，原月租通行保持恢复状态。');
    }
    function openReceipt(id) { showDrawer('办理凭据', `<div class="detail-section"><div class="detail-title">月租办理凭据</div><div class="detail-grid"><div><div class="field-label">订单号</div><div class="field-value">${id}</div></div><div><div class="field-label">当前状态</div><div class="field-value">${tag('待物业办理')}</div></div><div><div class="field-label">已支付金额</div><div class="field-value">¥1,680.00</div></div><div><div class="field-label">登记车牌</div><div class="field-value">浙A8P62K、浙AD91F8</div></div><div><div class="field-label">办理地点</div><div class="field-value">锦绣安置房物业服务中心</div></div><div><div class="field-label">联系人</div><div class="field-value">刘经理 0571-88990011</div></div></div></div><div class="notice">请用户凭此办理凭据在 2 个工作日内完成物业确认。物业确认后，系统将推送开闸系统开通月租通行。</div>`); }
    function openRefund(id) {
      selectedRefundId = id;
      refundSubpage = 'detail';
      current = 'refunds';
      render();
    }
    function showDrawer(title, body) { document.getElementById('drawerTitle').textContent = title; document.getElementById('drawerBody').innerHTML = body; document.getElementById('drawerMask').classList.add('open'); }
    function hideDrawer() { document.getElementById('drawerMask').classList.remove('open'); }
    function closeDrawer(e) { if (e.target.id === 'drawerMask') hideDrawer(); }
    function showModal(title, body) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      document.querySelector('#modalMask .modal')?.classList.remove('refund-approval-modal', 'invoice-upload-modal');
      const cancelButton = document.getElementById('modalCancelButton');
      const confirmButton = document.getElementById('modalConfirmButton');
      if (cancelButton) { cancelButton.textContent = '取消'; cancelButton.className = 'btn'; cancelButton.onclick = hideModal; }
      if (confirmButton) { confirmButton.textContent = '确认'; confirmButton.className = 'btn btn-primary'; confirmButton.onclick = hideModal; }
      document.getElementById('modalMask').classList.add('open');
    }
    function hideModal() { document.getElementById('modalMask').classList.remove('open'); }
    function closeModal(e) { if (e.target.id === 'modalMask') hideModal(); }

    render();
  </script>
</body>
</html>
