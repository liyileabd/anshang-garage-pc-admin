<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安商房车库月租PC管理后台</title>
  <!-- 共用样式 -->
  <link rel="stylesheet" href="css/common.css?v=20260917-7">
  <!-- 页面样式 -->
  <link rel="stylesheet" href="css/pages/login.css?v=20260918-6">
  <link rel="stylesheet" href="css/pages/dashboard.css?v=20260917-1">
  <link rel="stylesheet" href="css/pages/projects.css?v=20260916-1">
  <link rel="stylesheet" href="css/pages/users.css?v=20260916-1">

<body>
  <section id="login" class="login-screen hidden">
    <div class="login-brand">
      <div class="login-brand-top"><div class="login-brand-logo">安</div><span class="login-brand-name">安商房月租车管理后台</span></div>
      <h1>安商房小区月租车缴费<br>PC 管理后台</h1>
      <p>面向物业、运营与财务的统一管理工作台，覆盖项目车库配置、月租订单、自动清分与退款开票的全流程管理。</p>
      <ul class="login-points"><li>项目车库配置</li><li>月租订单管理</li><li>自动清分结算</li><li>退款与开票审批</li></ul>
    </div>
    <div class="login-panel-wrap">
      <div class="login-panel">
        <div class="login-title">安商房小区月租车缴费后台登录</div>
        <div class="login-sub">请输入管理员或工作人员账号</div>
        <div class="form-item"><div class="form-label">用户名</div><div id="loginAccountSelect" class="filter-dropdown login-account-select" data-value="admin"><button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" onclick="toggleLoginAccountMenu(event)"><span id="loginAccountText">admin</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="loginAccountMenu" class="select-menu"></div></div><input id="loginUsername" type="hidden" value="admin" /></div>
        <div class="form-item"><div class="form-label">密码</div><input id="loginPassword" class="form-control" type="password" value="123456" /></div>
        <div id="loginError" class="approval-error"></div>
        <button class="btn btn-primary" style="width:100%;height:48px" onclick="login()">登录</button>
        <div class="login-links"><button type="button" class="login-link" onclick="openLoginChangePassword()">修改密码</button><span class="login-link-sep"></span><button type="button" class="login-link" onclick="openForgotPassword()">忘记密码</button></div>
      </div>
    </div>
  </section>

  <section id="app" class="app">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-mark">安</div><span>月租车管理后台</span></div>
      <nav id="menu" class="menu"></nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div id="breadcrumb" class="breadcrumb">项目管理 / 小区项目</div>
        <div class="topbar-actions"><div class="account" id="accountBox" onclick="toggleAccountMenu(event)"><span class="avatar">管</span><span id="currentAccountName">超级管理员</span><div id="accountMenu" class="account-menu" role="menu"><button type="button" class="account-menu-item" role="menuitem" onclick="openProfile()">个人中心</button><button type="button" class="account-menu-item is-danger" role="menuitem" onclick="logout()">退出登录</button></div></div></div>
      </header>
      <section id="page" class="page"></section>
    </main>
  </section>

  <div id="drawerMask" class="drawer-mask" onclick="closeDrawer(event)">
    <aside class="drawer" onclick="event.stopPropagation()">
      <div class="drawer-head"><span id="drawerTitle">订单详情</span><button class="btn-text" onclick="hideDrawer()">关闭</button></div>
      <div id="drawerBody" class="drawer-body"></div>
      <div class="drawer-foot"><button class="btn" onclick="hideDrawer()">返回</button><button class="btn btn-primary" onclick="showModal('操作已记录', '当前处理动作已写入操作日志，后续可在操作日志中追溯。')">保存处理结果</button></div>
    </aside>
  </div>

  <div id="modalMask" class="modal-mask" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><span id="modalTitle">提示</span></div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-foot"><button id="modalCancelButton" class="btn" onclick="hideModal()">取消</button><button id="modalRejectButton" class="btn btn-danger" style="display: none" type="button">驳回</button><button id="modalConfirmButton" class="btn btn-primary" onclick="hideModal()">确认</button></div>
    </div>
  </div>

  <!-- JS：按依赖顺序加载 -->
  <script src="js/data.js?v=20260920-2"></script>
  <script src="js/common.js?v=20260920-3"></script>
  <script src="js/pages/dashboard.js?v=20260917-1"></script>
  <script src="js/pages/projects.js?v=20260917-2"></script>
  <script src="js/pages/users.js?v=20260915-3"></script>
  <script src="js/pages/orders.js?v=20260918-2"></script>
  <script src="js/pages/passages.js?v=20260916-1"></script>
  <script src="js/pages/refunds.js?v=20260917-1"></script>

  <!-- 标注接入适配：为离线标注编辑器提供页面上下文、目录跳转，以及一个显眼的「显示／隐藏标注」总开关。
       本段只服务标注层，不参与原型业务逻辑。 -->
  <script>
  (function () {
    var login = document.getElementById('login');
    var app = document.getElementById('app');
    var topbarButton = null, loginButton = null, labelOn = '隐藏标注', labelOff = '显示标注';

    function showLogin() { if (login) login.classList.remove('hidden'); if (app) app.classList.add('hidden'); }
    function showBackend() { if (login) login.classList.add('hidden'); if (app) app.classList.remove('hidden'); }
    function refresh() {
      if (window.HTMLAnnotationEditor && window.HTMLAnnotationEditor.refresh) window.HTMLAnnotationEditor.refresh();
    }
    function editorShadow() {
      var host = document.getElementById('hae-root');
      return host && host.shadowRoot ? host.shadowRoot : null;
    }
    function notesOn() {
      var sr = editorShadow();
      var btn = sr && sr.getElementById('toolNotes');
      return !!btn && btn.getAttribute('aria-pressed') === 'true';
    }
    function setNotes(show) {
      var sr = editorShadow();
      var btn = sr && sr.getElementById('toolNotes');
      if (btn && (btn.getAttribute('aria-pressed') === 'true') !== show) btn.click();
      syncButtons();
    }
    function syncButtons() {
      var on = notesOn();
      [topbarButton, loginButton].forEach(function (btn) {
        if (!btn) return;
        var txt = btn.querySelector('.ann-tool-text');
        if (txt) txt.textContent = on ? labelOn : labelOff;
        btn.title = on ? '收起页面上的标注标记' : '在页面上显示标注标记';
        if (on) btn.classList.add('is-on'); else btn.classList.remove('is-on');
      });
    }
    var toolIcon = '<svg class="ann-tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.6 12S6.5 5.9 12 5.9 21.4 12 21.4 12 17.5 18.1 12 18.1 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>';
    function makeButton() {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ann-tool';
      btn.innerHTML = toolIcon + '<span class="ann-tool-text"></span>';
      btn.onclick = function () { setNotes(!notesOn()); };
      return btn;
    }
    function mount() {
      var actions = document.querySelector('.topbar-actions');
      if (actions && !topbarButton) { topbarButton = makeButton(); actions.insertBefore(topbarButton, actions.firstChild); }
      if (login && !loginButton) {
        var card = login.querySelector('.login-panel') || login;
        if (getComputedStyle(card).position === 'static') card.style.position = 'relative';
        loginButton = makeButton();
        loginButton.classList.add('ann-tool-panel');
        card.appendChild(loginButton);
      }
    }
    function watchEditor(cb) {
      var tries = 0;
      (function tick() {
        var sr = editorShadow();
        var btn = sr && sr.getElementById('toolNotes');
        if (btn) {
          if (!btn.dataset.annWatched) {
            btn.dataset.annWatched = '1';
            new MutationObserver(syncButtons).observe(btn, { attributes: true, attributeFilter: ['aria-pressed'] });
          }
          cb();
          return;
        }
        if (++tries < 240) requestAnimationFrame(tick);
      })();
    }

    // 标注按页区分：登录页用 'login'，后台用 'backend:<页面键>'（页面键取自原型的 current）。
    function currentPageKey() {
      return (typeof current === 'string' && current) ? current : '';
    }
    window.htmlAnnotationContext = function () {
      if (login && !login.classList.contains('hidden')) return 'login';
      var key = currentPageKey();
      return key ? 'backend:' + key : 'backend';
    };
    window.htmlAnnotationNavigate = function (pageId) {
      if (pageId === 'login') {
        showLogin();
      } else if (pageId === 'backend') {
        showBackend();
      } else if (typeof pageId === 'string' && pageId.indexOf('backend:') === 0) {
        if (typeof window.switchPage !== 'function') throw new Error('未找到对应页面');
        showBackend();
        window.switchPage(pageId.slice('backend:'.length));
      } else {
        throw new Error('未找到对应页面');
      }
      refresh();
      syncButtons();
    };

    // 后台切页会整块重建 #page，换页后要让标注重新定位。
    var pageTick = null;
    function scheduleRefresh() {
      if (pageTick) return;
      pageTick = requestAnimationFrame(function () { pageTick = null; refresh(); });
    }
    function watchPage() {
      var host = document.getElementById('page');
      if (!host) return;
      new MutationObserver(scheduleRefresh).observe(host, { childList: true });
    }

    // 不改变原型原有行为：默认仍是免登录直接进入管理后台；地址栏带 #login 时停在登录页。
    function boot() {
      if (location.hash === '#login') showLogin();
      mount();
      watchPage();
      watchEditor(function () {
        // 默认收起标注标记，先看原型的整体效果；需要时点「显示标注」。
        if (notesOn()) setNotes(false);
        syncButtons();
      });
      refresh();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 0); });
    else setTimeout(boot, 0);
    window.addEventListener('load', function () { setTimeout(boot, 0); });
    window.addEventListener('hashchange', function () {
      if (location.hash === '#login') showLogin(); else if (location.hash === '#backend') showBackend();
      refresh();
    });
  })();
  </script>
  <style>
    /* 标注总开关：刻意不沿用原型的按钮样式（白底 + 描边 + 主色），
       改用深色胶囊，让它在页面上明显是「外挂的标注工具」，而不是原型界面的一部分。 */
    .ann-tool {
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 12px; border: 0; border-radius: 999px;
      background: #2f3643; color: #fff;
      font-family: inherit; font-size: 12.5px; line-height: 1; white-space: nowrap;
      cursor: pointer; box-shadow: 0 2px 8px rgba(20, 26, 38, .28);
      transition: background .15s ease, box-shadow .15s ease;
    }
    .ann-tool:hover { background: #3d4657; box-shadow: 0 3px 10px rgba(20, 26, 38, .34); }
    .ann-tool .ann-tool-icon {
      width: 14px; height: 14px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      opacity: .6;
    }
    .ann-tool.is-on { background: #4b3fd4; }
    .ann-tool.is-on .ann-tool-icon { opacity: 1; }
    .topbar-actions .ann-tool { margin-right: 12px; }
    .ann-tool-panel { position: absolute; top: -46px; right: 0; }
  </style>

        while (occupied.some(p => Math.abs(p.x-x)<32 && Math.abs(p.y-y)<32)) y += 32;
        y = Math.min(innerHeight-30, y); occupied.push({x,y}); marker.style.left = x+'px'; marker.style.top = y+'px'; markers.append(marker);
        const width = marker.getBoundingClientRect().width; marker.style.left = Math.max(2, Math.min(x, innerWidth-width-4))+'px';
      });
    }
    paintTarget();
    positionPopover();
    renderDirectory();
  }
  function schedule() {if (root.style.display !== 'none' && !queued) {queued = true; requestAnimationFrame(layout);}}
  function positionPopover() {
    const popup = $('popover'); if (popup.classList.contains('hide')) return;
    const note = formNote || notes.find(note=>note.id===selected);
    const rect = visibleRect(candidate || (note && resolve(note)));
    const reserved = {left:0,right:0};
    if (panelView && innerWidth >= 900 && !picking) reserved[dock] = panel.getBoundingClientRect().width + (panelView==='directory' ? 38 : 62);
    popup.style.maxWidth = Math.max(1,innerWidth-reserved.left-reserved.right-24)+'px';
    const box = popup.getBoundingClientRect();
    const point = placePopover(rect,box.width,box.height,{width:innerWidth,height:innerHeight},reserved);
    popup.style.left = point.x+'px'; popup.style.top = point.y+'px';
  }
  function paintTarget() {
    const note = notes.find(note=>note.id===selected);
    const target = picking || formNote ? candidate : (shown && note && resolve(note));
    const rect = visibleRect(target), high = $('highlight'), label = $('targetLabel');
    high.classList.toggle('selecting',picking || !!formNote);
    high.style.display = rect ? 'block' : 'none'; label.classList.toggle('hide', !rect || (!picking && !formNote));
    if (!rect) return;
    high.style.cssText = `display:block;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px`;
    label.textContent = target.localName + (target.id ? ' #' + target.id : '') + ' · ' + Math.round(rect.width) + ' × ' + Math.round(rect.height);
    label.style.left = rect.left+'px'; label.style.top = Math.max(0,rect.top-28)+'px';
  }
  function chooseChain(element) {
    chain = [];
    for (let node = element; node && node !== document.body && node !== document.documentElement; node = node.parentElement) {
      if (node !== root && !['script','style','meta','link'].includes(node.localName) && visibleRect(node)) chain.push(node);
    }
    depth = 0; candidate = chain[0] || null; paintTarget(); updateTargetControls();
  }
  function updateTargetControls() {
    $('parent').disabled = !formNote || !candidate || depth >= chain.length-1;
    $('child').disabled = !formNote || !candidate || depth === 0;
  }
  function beginPick() {
    ++navigationRequest;
    picking = true; candidate = null; chain = []; restoreFocus = shadow.activeElement;
    panel.classList.add('hide'); $('tools').classList.add('hide'); $('popover').classList.add('hide');
    say('移动鼠标识别区域，单击后直接填写注记；Esc 取消。'); schedule();
  }
  function endPick() {picking = false; $('tools').classList.remove('hide'); setPanel(null); updateTargetControls(); render();}
  function cancelPick() {candidate = null; endPick(); if (restoreFocus && restoreFocus.isConnected) restoreFocus.focus();}
  function startEdit(note) {
    ++navigationRequest;
    setPanel(null);
    formNote = clone(note); candidate = null; chain = []; depth = 0;
    const target = resolve(note); if (target) chooseChain(target);
    $('formTitle').textContent = '编辑注记'; $('body').value = note.body; $('type').value = note.type || '';
    $('confirmNote').textContent = '保存修改';
    configureNumber(note);
    $('location').textContent = '位置：' + note.selector;
    render(); $('body').focus();
  }
  function configureNumber(note) {
    $('number').value = note ? notes.findIndex(n => n.id === note.id)+1 : notes.length+1;
    $('number').max = notes.length+(note ? 0 : 1);
    $('number').disabled = false;
    $('numberHint').textContent = note ? '可输入 1～'+notes.length+'；保存后其他注记编号自动前移或顺延。' : '插入到此编号，原编号及后续标注自动顺延。';
  }
  function acceptTarget() {
    if (!candidate || !visibleRect(candidate)) {say('选区已失效，请重新选择。'); return;}
    const selector = selectorFor(candidate);
    if (!formNote) {
      formNote = {id:'note-'+crypto.randomUUID(), body:'', selector, context:context(), fingerprint:fingerprint(candidate), source:'手动添加'};
      $('formTitle').textContent = '添加注记'; $('body').value = ''; $('type').value = ''; configureNumber(null);
      $('confirmNote').textContent = '确认添加';
    } else Object.assign(formNote, {selector, context:context(), fingerprint:fingerprint(candidate)});
    const menus = hostMenus();
    const page = menuForNote({selector,context:context()},menus,document) || menuForNote({selector},menus,document);
    delete formNote.pageId;
    if (page) {formNote.pageId = page.id; if (page.selector && page.context === undefined) formNote.context = '*';}
    $('location').textContent = '位置：' + selector;
    endPick(); $('body').focus();
  }
  $('parent').onclick = () => {if (depth < chain.length-1) {candidate = chain[++depth]; acceptTarget();}};
  $('child').onclick = () => {if (depth > 0) {candidate = chain[--depth]; acceptTarget();}};
  $('form').onsubmit = event => {
    event.preventDefault();
    const body = $('body').value.trim(), type = $('type').value;
    if (!['字段说明','交互逻辑','业务规则','修改原型'].includes(type)) {say('请选择注记类型。'); return;}
    if (!body) {say('注记内容不能为空。'); return;}
    const note = {...formNote, body, type};
    delete note.title;
    if (!resolve(note)) {say('目标已变化或不唯一，请重新选择位置。'); return;}
    const exists = notes.some(n => n.id === note.id);
    try {commitNotes(exists ? editNote(notes,note,Number($('number').value)) : insertNote(notes,note,Number($('number').value)));}
    catch (error) {say(error.message); return;}
    selected = null; formNote = null; candidate = null; chain = []; render();
    say((exists ? '注记已更新' : '注记已添加')+'，请点击工具栏底部的保存写入文件。');
  };
  $('cancelNote').onclick = () => {formNote = null; candidate = null; chain = []; render();};
  $('relocate').onclick = beginPick;
  $('add').onclick = beginPick;
  $('exportList').onclick = () => {
    if (formNote || picking) return;
    try {
      const table = annotationTable(notes,hostMenus(),document,$('exportType').value), format = $('exportFormat').value;
      if (!['md','xlsx'].includes(format)) throw Error('请选择导出格式。');
      const content = format === 'md' ? listMarkdown(table) : listXLSX(table);
      const blob = new Blob([content],{type:format==='md'?'text/markdown;charset=utf-8':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = (document.title || '网页').replace(/[\\/:*?"<>|]/g,'-')+'-注记清单.'+format;
      shadow.append(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000);
      say('已发起注记清单下载，请确认文件已落盘。');
    } catch (error) {say('清单导出失败：'+error.message);}
  };
  $('shown').onchange = () => {shown = $('shown').checked; $('toolNotes').setAttribute('aria-pressed',String(shown)); render();};
  $('mode').onchange = () => {mode = $('mode').value; schedule();};
  $('dock').onchange = () => {dock = $('dock').value; setPanel(panelView);};
  $('collapse').onclick = () => setPanel(null);
  $('hideAll').onclick = () => {
    ++navigationRequest;
    picking = false;
    shadow.activeElement?.blur();
    root.style.setProperty('display', 'none', 'important');
  };
  $('toolDirectory').onclick = () => setPanel(panelView==='directory' ? null : 'directory');
  $('toolSettings').onclick = () => {setPanel(panelView==='settings' ? null : 'settings'); if (innerWidth<900 && !formNote) {selected=null;render();}};
  $('toolNotes').onclick = () => {$('shown').checked=!shown; $('shown').onchange();};
  $('toolSave').onclick = saveFile;
  $('closeNote').onclick = () => {if (formNote && !confirm('取消当前注记的未保存修改？')) return; ++navigationRequest;selected=null;formNote=null;candidate=null;render();};
  $('number').oninput = () => {$('noteNumber').textContent = '#'+$('number').value;};
  $('type').onchange = () => {$('noteType').textContent = $('type').value || '未设置类型'; $('popover').setAttribute('data-type',$('type').value);};
  new ResizeObserver(schedule).observe($('popover'));
  const ownEvent = event => event.composedPath().includes(root);
  const pointerTarget = (x,y) => document.elementsFromPoint(x,y).find(el => el !== root && !root.contains(el));
  document.addEventListener('pointermove', event => {if (picking && !ownEvent(event)) {chooseChain(pointerTarget(event.clientX,event.clientY));}}, true);
  for (const type of ['pointerdown','mousedown','pointerup','mouseup','click','dblclick','contextmenu']) document.addEventListener(type, event => {
    if (!picking || ownEvent(event)) return;
    event.preventDefault(); event.stopImmediatePropagation();
    if (type === 'click') {chooseChain(pointerTarget(event.clientX,event.clientY)); if (candidate) acceptTarget();}
  }, true);
  document.addEventListener('keydown', event => {
    if (!picking) return;
    if (event.key === 'Escape') {event.preventDefault(); event.stopImmediatePropagation(); cancelPick(); return;}
    if (ownEvent(event)) return;
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault(); event.stopImmediatePropagation();
      chooseChain(document.activeElement); if (candidate) acceptTarget();
    }
  }, true);
  window.addEventListener('beforeunload', event => {if (hasPageChanges || formNote) {event.preventDefault(); event.returnValue = '';}});
  window.addEventListener('resize', schedule); window.addEventListener('scroll', schedule, true);
  window.addEventListener('hashchange', schedule); window.addEventListener('popstate', schedule);
  document.addEventListener('transitionend', schedule, true); document.addEventListener('animationend', schedule, true);
  const observer = new MutationObserver(records => {if (records.some(r => r.target !== root && !root.contains(r.target))) schedule();});
  observer.observe(document.body,{subtree:true,childList:true,attributes:true,characterData:true});
  window.HTMLAnnotationEditor = {refresh: schedule};
  render();
})();
</script>
