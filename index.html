<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安商房车库月租PC管理后台</title>
  <!-- 共用样式 -->
  <link rel="stylesheet" href="css/common.css?v=20260916-8">
  <!-- 页面样式 -->
  <link rel="stylesheet" href="css/pages/login.css?v=20260916-1">
  <link rel="stylesheet" href="css/pages/dashboard.css?v=20260916-8">
  <link rel="stylesheet" href="css/pages/projects.css?v=20260916-1">
  <link rel="stylesheet" href="css/pages/users.css?v=20260916-1">
  <link rel="stylesheet" href="css/pages/orders.css?v=20260916-12">
  <link rel="stylesheet" href="css/pages/refunds.css?v=20260916-28">
  <link rel="stylesheet" href="css/pages/system.css?v=20260916-2">
  <link rel="stylesheet" href="css/pages/modals.css?v=20260916-1">
  <link rel="stylesheet" href="css/pages/create-flow.css?v=20260916-2">
</head>
<body>
  <section id="login" class="login-screen hidden">
    <div class="login-brand">
      <h1>安商房小区月租车缴费<br>PC 管理后台</h1>
      <p>用于项目车库配置、月租订单管理、自动清分和退款审批。界面按普通蓝白后台风格搭建，适合物业、运营和财务日常使用。</p>
      <div class="login-preview">
        <div class="mini-row">
          <div class="mini-card"><div class="mini-title">待处理事项</div><div class="mini-num">16</div></div>
          <div class="mini-card"><div class="mini-title">通行异常</div><div class="mini-num">5</div></div>
          <div class="mini-card"><div class="mini-title">退款待审批</div><div class="mini-num">7</div></div>
        </div>
        <div class="mini-line"></div><div class="mini-line"></div><div class="mini-line"></div><div class="mini-line"></div>
      </div>
    </div>
    <div class="login-panel-wrap">
      <div class="login-panel">
        <div class="login-title">后台登录</div>
        <div class="login-sub">请输入管理员或工作人员账号</div>
        <div class="form-item"><div class="form-label">用户名</div><input id="loginUsername" class="form-control" value="admin" /></div>
        <div class="form-item"><div class="form-label">密码</div><input id="loginPassword" class="form-control" type="password" value="123456" /></div>
        <div id="loginError" class="approval-error"></div>
        <button class="btn btn-primary" style="width:100%;height:40px" onclick="login()">登录</button>
      </div>
    </div>
  </section>

  <section id="app" class="app">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-mark">安</div><span>月租车管理后台</span></div>
      <nav id="menu" class="menu"></nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div id="breadcrumb" class="breadcrumb">项目管理 / 小区项目</div>
        <div class="topbar-actions"><span>消息 6</span><span>帮助</span><div class="account"><span class="avatar">管</span><span id="currentAccountName">超级管理员</span></div></div>
      </header>
      <section id="page" class="page"></section>
    </main>
  </section>

  <div id="drawerMask" class="drawer-mask" onclick="closeDrawer(event)">
    <aside class="drawer" onclick="event.stopPropagation()">
      <div class="drawer-head"><span id="drawerTitle">订单详情</span><button class="btn-text" onclick="hideDrawer()">关闭</button></div>
      <div id="drawerBody" class="drawer-body"></div>
      <div class="drawer-foot"><button class="btn" onclick="hideDrawer()">返回</button><button class="btn btn-primary" onclick="showModal('操作已记录', '当前处理动作已写入操作日志，后续可在操作日志中追溯。')">保存处理结果</button></div>
    </aside>
  </div>

  <div id="modalMask" class="modal-mask" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><span id="modalTitle">提示</span></div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-foot"><button id="modalCancelButton" class="btn" onclick="hideModal()">取消</button><button id="modalRejectButton" class="btn btn-danger" style="display: none" type="button">驳回</button><button id="modalConfirmButton" class="btn btn-primary" onclick="hideModal()">确认</button></div>
    </div>
  </div>

  <!-- JS：按依赖顺序加载 -->
  <script src="js/data.js?v=20260916-2"></script>
  <script src="js/common.js?v=20260916-13"></script>
  <script src="js/pages/dashboard.js?v=20260916-3"></script>
  <script src="js/pages/projects.js?v=20260916-2"></script>
  <script src="js/pages/users.js?v=20260915-3"></script>
  <script src="js/pages/orders.js?v=20260916-7"></script>
  <script src="js/pages/passages.js?v=20260916-1"></script>
  <script src="js/pages/refunds.js?v=20260916-14"></script>
  <script src="js/app.js?v=20260916-27"></script>
</body>
</html>
